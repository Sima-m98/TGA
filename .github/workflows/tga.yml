name: TGA alerts (1H golden + 15m setups)

on:
  schedule:
    - cron: "*/5 * * * 1-5"   # every 5 minutes, Monday to Friday (UTC)
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: tga
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check 1H alignment
        run: python tga_alert_bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Save state (so alerts are not repeated)
        run: |
          git config user.name "tga-bot"
          git config user.email "tga-bot@users.noreply.github.com"
          git add tga_state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
